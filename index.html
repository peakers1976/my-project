<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Last Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #1a1f16;
    font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
    cursor: crosshair;
  }
  canvas { display: block; }

  #hud {
    position: fixed;
    top: 14px;
    left: 14px;
    color: #f0f0e0;
    pointer-events: none;
    user-select: none;
    background: rgba(20, 24, 16, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px 18px;
    backdrop-filter: blur(4px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }
  #hud.critical {
    border-color: rgba(255, 90, 90, 0.5);
    animation: hudPulse 1s ease-in-out infinite;
  }
  @keyframes hudPulse {
    0%, 100% { box-shadow: 0 6px 18px rgba(0,0,0,0.35), 0 0 0 rgba(255,90,90,0); }
    50% { box-shadow: 0 6px 18px rgba(0,0,0,0.35), 0 0 16px rgba(255,90,90,0.55); }
  }
  .hud-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 5px 0;
    font-size: 16px;
    font-weight: 600;
    text-shadow: 1px 1px 2px #000;
  }
  .hud-row.primary { font-size: 20px; font-weight: 700; }
  .hud-icon { width: 20px; text-align: center; font-size: 16px; }
  #hud .gold { color: #ffd54a; }
  #hud .hp { color: #7be36b; }
  #hud .hp.low { color: #ff5a5a; }
  #hud .timer { color: #9ad6ff; }

  #hint {
    position: fixed;
    bottom: 12px;
    left: 14px;
    color: #e4e4d6;
    font-size: 13px;
    font-weight: 600;
    background: rgba(20, 24, 16, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 8px 14px;
    border-radius: 8px;
    pointer-events: none;
    user-select: none;
    backdrop-filter: blur(4px);
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    text-align: center;
    z-index: 10;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease;
  }
  #overlay.show { opacity: 1; visibility: visible; }
  #overlay .panel {
    transform: scale(0.9);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #overlay.show .panel { transform: scale(1); }
  #overlay h1 {
    font-size: 52px;
    margin-bottom: 10px;
    font-weight: 700;
    text-shadow: 0 4px 18px rgba(0,0,0,0.6);
  }
  #overlay p { font-size: 18px; margin-bottom: 25px; color: #ccc; }
  #overlay button {
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    padding: 13px 30px;
    background: linear-gradient(180deg, #63a94f, #3f6b34);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  #overlay button:hover {
    background: linear-gradient(180deg, #74c25e, #4a7c3c);
    transform: scale(1.05);
    box-shadow: 0 8px 22px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  #overlay button:active { transform: scale(0.97); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-row primary"><span class="hud-icon">&#128737;&#65039;</span>Town HP: <span class="hp" id="hpVal">0</span></div>
  <div class="hud-row"><span class="hud-icon">&#129689;</span>Gold: <span class="gold" id="goldVal">0</span></div>
  <div class="hud-row"><span class="hud-icon">&#9200;</span>Time left: <span class="timer" id="timeVal">10:00</span></div>
</div>

<div id="hint">WASD move &middot; Mouse aim &middot; Left click shoot / click objects to build &amp; upgrade</div>

<div id="overlay">
  <div class="panel">
    <h1 id="overlayTitle">You Win!</h1>
    <p id="overlaySub">The village survived.</p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Constants / balance tables ----------
  const WIN_TIME = 600; // 10 minutes in seconds
  const CORE_POS = { x: 0, y: 0 };
  const CORE_MAX_HP = 500;
  const CORE_CLICK_RADIUS = 46;
  const FORGE_POS = { x: -120, y: -110 };
  const FORGE_CLICK_RADIUS = 34;

  const TOWER_SPOTS_DEF = [
    { x: 160, y: -120 },
    { x: -170, y: 130 },
    { x: 180, y: 150 },
    { x: -180, y: -150 }
  ];
  const TOWER_CLICK_RADIUS = 30;
  const TOWER_LEVELS = [
    null, // index 0 unused (empty)
    { cost: 15, damage: 8, range: 170, fireRate: 1.2, hp: 40 },   // level 1 (built)
    { cost: 30, damage: 16, range: 200, fireRate: 1.8, hp: 40 }   // level 2
  ];

  const WEAPON_TIERS = [
    { damage: 10, fireRate: 3.0, cost: 0 },   // tier 0 (starting)
    { damage: 16, fireRate: 3.6, cost: 20 },  // tier 1
    { damage: 24, fireRate: 4.4, cost: 45 },  // tier 2
    { damage: 34, fireRate: 5.2, cost: 80 }   // tier 3 (max)
  ];

  const CORE_REPAIR = { cost: 15, heal: 80 };

  const ENEMY_DEFS = {
    fast:   { hp: 18,  speed: 95, damage: 6,  radius: 11, color: '#e8c34a', gold: 3 },
    strong: { hp: 60,  speed: 42, damage: 18, radius: 16, color: '#c24a3a', gold: 7 }
  };

  const PLAYER_SPEED = 210;
  const PLAYER_RADIUS = 14;
  const BULLET_SPEED = 520;
  const BULLET_RADIUS = 4;
  const GOLD_PICKUP_RADIUS = 40;
  const GOLD_MAGNET_SPEED = 260;
  const WORLD_SPAWN_RADIUS = 620;

  // ---------- Game state ----------
  let state = null;

  function makeInitialState() {
    return {
      elapsedTime: 0,
      gold: 20,
      status: 'playing', // 'playing' | 'won' | 'lost'
      core: { x: CORE_POS.x, y: CORE_POS.y, hp: CORE_MAX_HP, maxHp: CORE_MAX_HP },
      forge: { x: FORGE_POS.x, y: FORGE_POS.y, weaponTier: 0 },
      towerSpots: TOWER_SPOTS_DEF.map(p => ({
        x: p.x, y: p.y, level: 0, cooldown: 0
      })),
      player: {
        x: 0, y: 90, angle: 0, hp: 100
      },
      enemies: [],
      bullets: [],
      goldDrops: [],
      spawnTimer: 0,
      camera: { x: 0, y: 0 }
    };
  }

  // ---------- Input ----------
  const keys = { w: false, a: false, s: false, d: false };
  const mouse = { x: 0, y: 0, down: false, worldX: 0, worldY: 0 };

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k in keys) keys[k] = true;
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k in keys) keys[k] = false;
  });
  canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    mouse.down = true;
    handleClick();
  });
  canvas.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    mouse.down = false;
  });

  function screenToWorld(sx, sy) {
    return {
      x: sx - canvas.width / 2 + state.camera.x,
      y: sy - canvas.height / 2 + state.camera.y
    };
  }

  function dist(ax, ay, bx, by) {
    return Math.hypot(ax - bx, ay - by);
  }

  // ---------- Click handling (build / upgrade / repair take priority over shooting) ----------
  function handleClick() {
    if (state.status !== 'playing') return;
    const w = screenToWorld(mouse.x, mouse.y);

    // Forge
    if (dist(w.x, w.y, state.forge.x, state.forge.y) <= FORGE_CLICK_RADIUS) {
      upgradeWeapon();
      return;
    }

    // Town core
    if (dist(w.x, w.y, state.core.x, state.core.y) <= CORE_CLICK_RADIUS) {
      repairCore();
      return;
    }

    // Tower spots
    for (const spot of state.towerSpots) {
      if (dist(w.x, w.y, spot.x, spot.y) <= TOWER_CLICK_RADIUS) {
        buildOrUpgradeTower(spot);
        return;
      }
    }

    // Otherwise: fire a bullet immediately toward click point
    fireBullet();
  }

  function upgradeWeapon() {
    const nextTier = state.forge.weaponTier + 1;
    if (nextTier >= WEAPON_TIERS.length) return; // maxed
    const cost = WEAPON_TIERS[nextTier].cost;
    if (state.gold >= cost) {
      state.gold -= cost;
      state.forge.weaponTier = nextTier;
    }
  }

  function repairCore() {
    if (state.core.hp >= state.core.maxHp) return;
    if (state.gold >= CORE_REPAIR.cost) {
      state.gold -= CORE_REPAIR.cost;
      state.core.hp = Math.min(state.core.maxHp, state.core.hp + CORE_REPAIR.heal);
    }
  }

  function buildOrUpgradeTower(spot) {
    const nextLevel = spot.level + 1;
    if (nextLevel >= TOWER_LEVELS.length) return; // maxed
    const cost = TOWER_LEVELS[nextLevel].cost;
    if (state.gold >= cost) {
      state.gold -= cost;
      spot.level = nextLevel;
    }
  }

  // ---------- Player shooting ----------
  let fireCooldown = 0;
  function fireBullet() {
    const tier = WEAPON_TIERS[state.forge.weaponTier];
    if (fireCooldown > 0) return;
    fireCooldown = 1 / tier.fireRate;
    const p = state.player;
    state.bullets.push({
      x: p.x, y: p.y,
      vx: Math.cos(p.angle) * BULLET_SPEED,
      vy: Math.sin(p.angle) * BULLET_SPEED,
      damage: tier.damage,
      owner: 'player',
      life: 1.2
    });
  }

  // ---------- Difficulty scaling ----------
  function getSpawnInterval() {
    const t = state.elapsedTime;
    const interval = 2.2 - Math.min(1.6, t / 300); // 2.2s -> 0.6s over ~5 min
    return Math.max(0.55, interval);
  }
  function getEnemyMultiplier() {
    const t = state.elapsedTime;
    return 1 + Math.min(1.5, t / 260); // up to 2.5x stats
  }
  function getStrongChance() {
    const t = state.elapsedTime;
    return Math.min(0.6, 0.15 + t / 700);
  }

  function spawnEnemy() {
    const type = Math.random() < getStrongChance() ? 'strong' : 'fast';
    const def = ENEMY_DEFS[type];
    const mult = getEnemyMultiplier();
    const angle = Math.random() * Math.PI * 2;
    const x = state.core.x + Math.cos(angle) * WORLD_SPAWN_RADIUS;
    const y = state.core.y + Math.sin(angle) * WORLD_SPAWN_RADIUS;
    state.enemies.push({
      type, x, y,
      hp: def.hp * mult,
      maxHp: def.hp * mult,
      speed: def.speed,
      damage: def.damage * mult,
      radius: def.radius,
      color: def.color,
      goldValue: def.gold,
      attackCooldown: 0
    });
  }

  // ---------- Update ----------
  function update(dt) {
    if (state.status !== 'playing') return;

    state.elapsedTime += dt;
    if (state.elapsedTime >= WIN_TIME) {
      endGame('won');
      return;
    }

    updatePlayer(dt);
    updateTowers(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateGoldDrops(dt);

    // Spawning
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnEnemy();
      state.spawnTimer = getSpawnInterval();
    }

    // Continuous fire while mouse held (unless the held click started on UI object, harmless to re-check)
    if (fireCooldown > 0) fireCooldown -= dt;
    if (mouse.down && fireCooldown <= 0) {
      const w = screenToWorld(mouse.x, mouse.y);
      const onForge = dist(w.x, w.y, state.forge.x, state.forge.y) <= FORGE_CLICK_RADIUS;
      const onCore = dist(w.x, w.y, state.core.x, state.core.y) <= CORE_CLICK_RADIUS;
      const onTower = state.towerSpots.some(s => dist(w.x, w.y, s.x, s.y) <= TOWER_CLICK_RADIUS);
      if (!onForge && !onCore && !onTower) fireBullet();
    }

    if (state.core.hp <= 0) {
      endGame('lost');
    }

    // Camera follows player
    state.camera.x = state.player.x;
    state.camera.y = state.player.y;
  }

  function updatePlayer(dt) {
    const p = state.player;
    let dx = 0, dy = 0;
    if (keys.w) dy -= 1;
    if (keys.s) dy += 1;
    if (keys.a) dx -= 1;
    if (keys.d) dx += 1;
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      p.x += (dx / len) * PLAYER_SPEED * dt;
      p.y += (dy / len) * PLAYER_SPEED * dt;
    }
    const w = screenToWorld(mouse.x, mouse.y);
    p.angle = Math.atan2(w.y - p.y, w.x - p.x);
  }

  function updateTowers(dt) {
    for (const spot of state.towerSpots) {
      if (spot.level <= 0) continue;
      const def = TOWER_LEVELS[spot.level];
      spot.cooldown -= dt;
      if (spot.cooldown > 0) continue;

      let target = null, best = Infinity;
      for (const e of state.enemies) {
        const d = dist(spot.x, spot.y, e.x, e.y);
        if (d <= def.range && d < best) { best = d; target = e; }
      }
      if (target) {
        const angle = Math.atan2(target.y - spot.y, target.x - spot.x);
        state.bullets.push({
          x: spot.x, y: spot.y,
          vx: Math.cos(angle) * BULLET_SPEED,
          vy: Math.sin(angle) * BULLET_SPEED,
          damage: def.damage,
          owner: 'tower',
          life: def.range / BULLET_SPEED + 0.2
        });
        spot.cooldown = 1 / def.fireRate;
      }
    }
  }

  function updateEnemies(dt) {
    for (const e of state.enemies) {
      const dx = state.core.x - e.x;
      const dy = state.core.y - e.y;
      const d = Math.hypot(dx, dy);
      const stopDist = 22;
      if (d > stopDist) {
        e.x += (dx / d) * e.speed * dt;
        e.y += (dy / d) * e.speed * dt;
      } else {
        e.attackCooldown -= dt;
        if (e.attackCooldown <= 0) {
          state.core.hp -= e.damage;
          e.attackCooldown = 1.0;
        }
      }
    }
    // remove dead enemies -> drop gold
    for (let i = state.enemies.length - 1; i >= 0; i--) {
      const e = state.enemies[i];
      if (e.hp <= 0) {
        state.goldDrops.push({ x: e.x, y: e.y, value: e.goldValue });
        state.enemies.splice(i, 1);
      }
    }
  }

  function updateBullets(dt) {
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      let hit = false;
      if (b.owner === 'player' || b.owner === 'tower') {
        for (const e of state.enemies) {
          if (e.hp <= 0) continue;
          if (dist(b.x, b.y, e.x, e.y) <= e.radius + BULLET_RADIUS) {
            e.hp -= b.damage;
            hit = true;
            break;
          }
        }
      }
      if (hit || b.life <= 0) {
        state.bullets.splice(i, 1);
      }
    }
  }

  function updateGoldDrops(dt) {
    const p = state.player;
    for (let i = state.goldDrops.length - 1; i >= 0; i--) {
      const g = state.goldDrops[i];
      const d = dist(p.x, p.y, g.x, g.y);
      if (d <= GOLD_PICKUP_RADIUS) {
        state.gold += g.value;
        state.goldDrops.splice(i, 1);
      } else if (d <= GOLD_PICKUP_RADIUS * 3) {
        // slight magnet pull for feel
        g.x += (p.x - g.x) / d * GOLD_MAGNET_SPEED * dt;
        g.y += (p.y - g.y) / d * GOLD_MAGNET_SPEED * dt;
      }
    }
  }

  function endGame(result) {
    state.status = result;
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('overlayTitle');
    const sub = document.getElementById('overlaySub');
    if (result === 'won') {
      title.textContent = 'You Win!';
      sub.textContent = 'The village survived the night.';
    } else {
      title.textContent = 'Village Lost';
      sub.textContent = 'The town core has fallen.';
    }
    overlay.classList.add('show');
  }

  // ---------- Draw ----------
  function worldToScreen(x, y) {
    return {
      x: x - state.camera.x + canvas.width / 2,
      y: y - state.camera.y + canvas.height / 2
    };
  }

  function drawHealthBar(sx, sy, width, ratio, color) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(sx - width / 2, sy, width, 6);
    ctx.fillStyle = color;
    ctx.fillRect(sx - width / 2, sy, width * Math.max(0, ratio), 6);
  }

  // ---------- Visual helpers (shading / glow / shadows / labels) ----------
  function shadeColor(hex, percent) {
    const num = parseInt(hex.slice(1), 16);
    let r = (num >> 16) & 0xff, g = (num >> 8) & 0xff, b = num & 0xff;
    const adjust = (c) => {
      const delta = percent >= 0 ? (255 - c) * percent : c * percent;
      return Math.max(0, Math.min(255, Math.round(c + delta)));
    };
    return `rgb(${adjust(r)}, ${adjust(g)}, ${adjust(b)})`;
  }

  function radialShadedFill(cx, cy, radius, baseColor) {
    const grad = ctx.createRadialGradient(
      cx - radius * 0.35, cy - radius * 0.35, radius * 0.05,
      cx, cy, radius * 1.05
    );
    grad.addColorStop(0, shadeColor(baseColor, 0.45));
    grad.addColorStop(0.55, baseColor);
    grad.addColorStop(1, shadeColor(baseColor, -0.35));
    return grad;
  }

  function drawGroundShadow(sx, sy, rx, ry) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(sx, sy + rx * 0.15, rx, ry !== undefined ? ry : rx * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fill();
    ctx.restore();
  }

  function withGlow(color, blur, drawFn) {
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
    drawFn();
    ctx.restore();
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawChipLabel(cx, baselineY, text, textColor) {
    ctx.font = '600 12px "Rajdhani", Arial, sans-serif';
    ctx.textAlign = 'center';
    const metrics = ctx.measureText(text);
    const paddingX = 8;
    const w = metrics.width + paddingX * 2;
    const h = 19;
    const top = baselineY - h + 5;
    ctx.fillStyle = 'rgba(10, 12, 8, 0.62)';
    roundRectPath(cx - w / 2, top, w, h, 6);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.09)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.fillText(text, cx, baselineY - 5);
  }

  function draw() {
    ctx.fillStyle = '#2b3a24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // soft "town clearing" glow around the core, fading into the wilderness
    {
      const s = worldToScreen(state.core.x, state.core.y);
      const clearing = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 480);
      clearing.addColorStop(0, 'rgba(74, 94, 58, 0.55)');
      clearing.addColorStop(0.55, 'rgba(58, 76, 46, 0.22)');
      clearing.addColorStop(1, 'rgba(43, 58, 36, 0)');
      ctx.fillStyle = clearing;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // ground texture: subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    const gridSize = 60;
    const offX = -(state.camera.x % gridSize);
    const offY = -(state.camera.y % gridSize);
    for (let x = offX; x < canvas.width; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = offY; y < canvas.height; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    const UI_FONT = '"Rajdhani", Arial, sans-serif';

    // Town core
    {
      const s = worldToScreen(state.core.x, state.core.y);
      drawGroundShadow(s.x, s.y + 30, 30, 12);
      withGlow('rgba(255, 205, 120, 0.35)', 22, () => {
        ctx.fillStyle = radialShadedFill(s.x, s.y, 34, '#8a6d3b');
        ctx.beginPath();
        ctx.arc(s.x, s.y, 34, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.strokeStyle = '#5c4a28';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = `700 14px ${UI_FONT}`;
      ctx.textAlign = 'center';
      ctx.fillText('CORE', s.x, s.y + 5);
      drawHealthBar(s.x, s.y + 44, 60, state.core.hp / state.core.maxHp, '#7be36b');
      if (state.core.hp < state.core.maxHp) {
        drawChipLabel(s.x, s.y + 72, `Repair (${CORE_REPAIR.cost}g)`, '#ffd54a');
      }
    }

    // Forge
    {
      const s = worldToScreen(state.forge.x, state.forge.y);
      drawGroundShadow(s.x, s.y + 20, 22, 9);
      ctx.fillStyle = radialShadedFill(s.x, s.y, 24, '#5a5a5a');
      ctx.beginPath();
      ctx.arc(s.x, s.y, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c24a3a';
      ctx.lineWidth = 3;
      ctx.stroke();
      withGlow('rgba(255, 130, 60, 0.65)', 10, () => {
        ctx.fillStyle = '#ff9d52';
        ctx.beginPath();
        ctx.arc(s.x, s.y + 6, 5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = '#fff';
      ctx.font = `700 11px ${UI_FONT}`;
      ctx.textAlign = 'center';
      ctx.fillText('FORGE', s.x, s.y - 6);
      const nextTier = state.forge.weaponTier + 1;
      if (nextTier < WEAPON_TIERS.length) {
        drawChipLabel(s.x, s.y + 48, `Upgrade (${WEAPON_TIERS[nextTier].cost}g)`, '#ffd54a');
      } else {
        drawChipLabel(s.x, s.y + 48, 'Max Level', '#9ad6ff');
      }
    }

    // Tower spots
    const pulse = 0.5 + 0.5 * Math.sin(state.elapsedTime * 3);
    for (const spot of state.towerSpots) {
      const s = worldToScreen(spot.x, spot.y);
      if (spot.level <= 0) {
        ctx.strokeStyle = `rgba(154, 214, 255, ${0.35 + 0.35 * pulse})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.arc(s.x, s.y, 20, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        drawChipLabel(s.x, s.y + 46, `Build (${TOWER_LEVELS[1].cost}g)`, '#9ad6ff');
      } else {
        const def = TOWER_LEVELS[spot.level];
        // range indicator (subtle)
        ctx.strokeStyle = 'rgba(154,214,255,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, def.range, 0, Math.PI * 2);
        ctx.stroke();

        drawGroundShadow(s.x, s.y + 16, 18, 8);
        ctx.fillStyle = radialShadedFill(s.x, s.y, 18, '#4a6fa5');
        ctx.beginPath();
        ctx.arc(s.x, s.y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2c4a75';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = `700 12px ${UI_FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText('L' + spot.level, s.x, s.y + 4);
        const nextLevel = spot.level + 1;
        if (nextLevel < TOWER_LEVELS.length) {
          drawChipLabel(s.x, s.y + 46, `Upgrade (${TOWER_LEVELS[nextLevel].cost}g)`, '#ffd54a');
        } else {
          drawChipLabel(s.x, s.y + 46, 'Max Level', '#9ad6ff');
        }
      }
    }

    // Gold drops
    for (const g of state.goldDrops) {
      const s = worldToScreen(g.x, g.y);
      withGlow('rgba(255, 213, 74, 0.85)', 14, () => {
        ctx.fillStyle = radialShadedFill(s.x, s.y, 6, '#ffd54a');
        ctx.beginPath();
        ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.strokeStyle = '#a87f00';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Enemies
    for (const e of state.enemies) {
      const s = worldToScreen(e.x, e.y);
      const rimColor = e.type === 'strong' ? '#7a1f1f' : '#fff2b0';
      drawGroundShadow(s.x, s.y + e.radius * 0.5, e.radius * 0.9, e.radius * 0.35);
      ctx.fillStyle = radialShadedFill(s.x, s.y, e.radius, e.color);
      ctx.beginPath();
      ctx.arc(s.x, s.y, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = rimColor;
      ctx.lineWidth = 2;
      ctx.stroke();
      drawHealthBar(s.x, s.y - e.radius - 10, e.radius * 2.2, e.hp / e.maxHp, '#ff5a5a');
    }

    // Bullets
    for (const b of state.bullets) {
      const s = worldToScreen(b.x, b.y);
      const color = b.owner === 'player' ? '#fff59d' : '#9ad6ff';
      withGlow(color, 10, () => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, BULLET_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Player
    {
      const p = state.player;
      const s = worldToScreen(p.x, p.y);
      drawGroundShadow(s.x, s.y + PLAYER_RADIUS * 0.6, PLAYER_RADIUS * 0.9, PLAYER_RADIUS * 0.35);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = radialShadedFill(0, 0, PLAYER_RADIUS, '#7be36b');
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#2f5a24';
      ctx.lineWidth = 3;
      ctx.stroke();
      // facing indicator
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(PLAYER_RADIUS + 2, 0);
      ctx.lineTo(PLAYER_RADIUS - 6, -6);
      ctx.lineTo(PLAYER_RADIUS - 6, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    updateHUD();
  }

  function formatTime(t) {
    const remaining = Math.max(0, WIN_TIME - t);
    const m = Math.floor(remaining / 60);
    const s = Math.floor(remaining % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function updateHUD() {
    document.getElementById('goldVal').textContent = Math.floor(state.gold);
    const hpEl = document.getElementById('hpVal');
    hpEl.textContent = Math.max(0, Math.ceil(state.core.hp));
    const critical = state.core.hp < state.core.maxHp * 0.3;
    hpEl.classList.toggle('low', critical);
    document.getElementById('hud').classList.toggle('critical', critical);
    document.getElementById('timeVal').textContent = formatTime(state.elapsedTime);
  }

  // ---------- Main loop ----------
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Restart ----------
  document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('overlay').classList.remove('show');
    state = makeInitialState();
    fireCooldown = 0;
  });

  // ---------- Start ----------
  state = makeInitialState();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
